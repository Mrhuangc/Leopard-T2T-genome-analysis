[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "felidae-or-mining"
version = "1.1.3"
description = "NC-compatible olfactory receptor gene-family mining for felids"
requires-python = ">=3.11,<3.13"
dependencies = [
  "biopython>=1.85,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
felidae-or = "or_mining.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer intentionally declares CLI metadata through Argument/Option defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
